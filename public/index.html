<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tablet Camera Timelapse</title>
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/ui.css">
</head>
<body>
  <!-- Small tiles (a KIP Embed Webpage widget): one button. -->
  <div class="tl-page-compact" id="compact" hidden></div>
  <!-- Larger tiles and standalone: the full settings view. -->
  <div class="tl-page tl-page-full" id="full" hidden>
    <header class="tl-page-head">
      <h1>Timelapse</h1>
      <button class="tl-icon-btn" id="back" type="button" aria-label="Back" hidden>×</button>
    </header>
    <div id="settings"></div>
  </div>
  <script type="module" src="js/hosts/page.js"></script>
</body>
</html>
